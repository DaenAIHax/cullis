apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cullis-mastio.configMapName" . }}
  labels:
    {{- include "cullis-mastio.proxy.labels" . | nindent 4 }}
data:
  MCP_PROXY_ENVIRONMENT: {{ .Values.proxy.environment | quote }}
  MCP_PROXY_HOST: "0.0.0.0"
  MCP_PROXY_PORT: {{ .Values.proxy.containerPort | quote }}

  # #114 — standalone mode toggles broker uplink off.
  MCP_PROXY_STANDALONE: {{ .Values.proxy.standalone | default false | quote }}

  {{- if .Values.proxy.brokerUrl }}
  MCP_PROXY_BROKER_URL: {{ .Values.proxy.brokerUrl | quote }}
  {{- end }}
  {{- if .Values.proxy.brokerJwksUrl }}
  MCP_PROXY_BROKER_JWKS_URL: {{ .Values.proxy.brokerJwksUrl | quote }}
  {{- end }}
  MCP_PROXY_BROKER_VERIFY_TLS: {{ .Values.proxy.brokerVerifyTls | quote }}

  {{- if .Values.proxy.proxyPublicUrl }}
  MCP_PROXY_PROXY_PUBLIC_URL: {{ .Values.proxy.proxyPublicUrl | quote }}
  {{- else if .Values.ingress.enabled }}
  MCP_PROXY_PROXY_PUBLIC_URL: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host | quote }}
  {{- end }}

  {{- if .Values.proxy.pdpUrl }}
  MCP_PROXY_PDP_URL: {{ .Values.proxy.pdpUrl | quote }}
  {{- end }}

  {{- if .Values.proxy.orgId }}
  MCP_PROXY_ORG_ID: {{ .Values.proxy.orgId | quote }}
  {{- end }}

  # ADR-039 — AI gateway dispatch backend. Default ``cullis_native``:
  # per-provider native adapters (Anthropic SDK, OpenAI SDK, raw httpx
  # for Ollama), no third-party library in the critical path. Operators
  # pinning ``litellm_embedded`` for Gemini / Bedrock / Vertex must also
  # ship the ``litellm-legacy`` extra in the image (or install
  # ``litellm>=1.83.7,<2.0`` out-of-band) — see PR-F.
  {{- if .Values.proxy.aiGatewayBackend }}
  MCP_PROXY_AI_GATEWAY_BACKEND: {{ .Values.proxy.aiGatewayBackend | quote }}
  {{- end }}

  # ADR-014 — nginx sidecar TLS material. Empty when nginx.enabled=false
  # so the lifespan skips the cert-provisioning path (no consumer to
  # serve the certs to).
  {{- if .Values.nginx.enabled }}
  MCP_PROXY_NGINX_CERT_DIR: {{ .Values.nginx.certDir | quote }}
  MCP_PROXY_NGINX_SAN: {{ .Values.nginx.san | quote }}
  {{- else }}
  MCP_PROXY_NGINX_CERT_DIR: ""
  {{- end }}

  # ADR-001 Phase 2 — SPIFFE routing decision. trust_domain is the SPIFFE
  # trust domain this proxy serves; intra_org_routing gates the new routing
  # decision (default off — Phase 3 wires real local delivery).
  PROXY_TRUST_DOMAIN: {{ .Values.proxy.trustDomain | default "cullis.local" | quote }}
  PROXY_INTRA_ORG: {{ .Values.proxy.intraOrgRouting | default false | quote }}

  MCP_PROXY_ALLOWED_ORIGINS: {{ .Values.proxy.allowedOrigins | quote }}

  # PROXY_DB_URL is the canonical name (ADR-001 Phase 1.3). The legacy
  # MCP_PROXY_DATABASE_URL is kept so older proxy images still pick the
  # value up — the runtime takes PROXY_DB_URL as authoritative when both
  # are set.
  PROXY_DB_URL: {{ include "cullis-mastio.databaseUrl" . | quote }}
  MCP_PROXY_DATABASE_URL: {{ include "cullis-mastio.databaseUrl" . | quote }}

  {{- if .Values.vault.enabled }}
  MCP_PROXY_SECRET_BACKEND: "vault"
  MCP_PROXY_VAULT_ADDR: {{ .Values.vault.addr | quote }}
  MCP_PROXY_VAULT_SECRET_PREFIX: {{ .Values.vault.secretPrefix | quote }}
  # ADR-031 — Org CA private key custodied in Vault. validate_config
  # refuses to boot in production with kms_backend=local (the key would
  # sit in the DB). Tied to vault.enabled so a production deploy that
  # turns Vault on also moves the crown-jewel key there.
  MCP_PROXY_KMS_BACKEND: "vault"
  MCP_PROXY_VAULT_ORG_CA_PATH: {{ .Values.vault.orgCaPath | default "secret/data/cullis-mastio/org-ca" | quote }}
  {{- if .Values.vault.caCertPath }}
  MCP_PROXY_VAULT_CA_CERT_PATH: {{ .Values.vault.caCertPath | quote }}
  {{- end }}
  {{- else }}
  MCP_PROXY_SECRET_BACKEND: "env"
  {{- end }}

  # DPoP JTI + login-challenge nonce store. Production refuses the
  # in-memory fallback for multi-replica/multi-worker (cross-worker
  # replay of login nonces), so REDIS_URL must point at a reachable
  # Redis. K8s deploys bring their own (managed Redis or a subchart).
  {{- if .Values.proxy.redisUrl }}
  MCP_PROXY_REDIS_URL: {{ .Values.proxy.redisUrl | quote }}
  {{- end }}

  # Egress DPoP enforcement (F-B-11). ``required`` is the zero-trust
  # posture; production refuses optional/off unless the operator opts
  # into the agent-enrollment migration window via WEBAUTHN-style flag.
  MCP_PROXY_EGRESS_DPOP_MODE: {{ .Values.proxy.egressDpopMode | default "required" | quote }}

  # WebAuthn on-behalf-of-user attribution (ADR-033 / F-A-205). Default
  # ``warn``; production refuses warn/off unless the operator opts in
  # (single-Mastio pilots with no IdP-backed user registration).
  MCP_PROXY_WEBAUTHN_ENFORCEMENT: {{ .Values.proxy.webauthn.enforcement | default "warn" | quote }}
  {{- if .Values.proxy.webauthn.warnInsecureOk }}
  MCP_PROXY_WEBAUTHN_WARN_INSECURE_OK: "true"
  {{- end }}
  {{- if .Values.proxy.webauthn.rpId }}
  MCP_PROXY_WEBAUTHN_RP_ID: {{ .Values.proxy.webauthn.rpId | quote }}
  {{- end }}
  {{- if .Values.proxy.webauthn.expectedOrigin }}
  MCP_PROXY_WEBAUTHN_EXPECTED_ORIGIN: {{ .Values.proxy.webauthn.expectedOrigin | quote }}
  {{- end }}
