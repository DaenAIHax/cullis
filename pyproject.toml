[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cullis-sdk"
version = "0.2.1"
description = "Python SDK for Cullis, federated agent trust broker"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "PyJWT[crypto]>=2.8.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-repeat>=0.9",
    # asyncio + xdist are load-bearing for the core test suite:
    # asyncio_mode=auto (see [tool.pytest.ini_options]) needs pytest-asyncio,
    # and the CI/local full runs use `-n auto --dist=loadfile` (pytest-xdist).
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "mypy>=1.10",
]
connector = [
    "mcp>=1.0",
    "PyYAML>=6.0",
    "bcrypt>=4.0",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # OS-native desktop notifications for the inbox poller.
    # plyer is a thin wrapper around libnotify (Linux), NSUserNotification
    # (macOS) and Windows Toast — falls back to stderr when missing so
    # `connector` deploys without `dashboard` keep working.
    "plyer>=2.1",
]
# Native desktop shell: tray icon + system webview wrapping the
# dashboard so non-technical users never see a terminal. Builds on
# top of `dashboard` — keep both installed together.
#   pywebview: embeds the OS-native webview (Cocoa WebKit, WebView2,
#              GTK WebKit) pointed at http://127.0.0.1:7777.
#   pystray : system-tray icon with a minimal menu (Open / Quit).
#   Pillow  : drawing surface for the tray glyph (we render the
#             portcullis mark at runtime, no PNG assets to ship).
# Platform prerequisites not installable via pip: on Linux the user
# still needs `gtk3` + `webkit2gtk` (present by default on mainstream
# distros); macOS and Windows 10+ ship the webview in the OS.
desktop = [
    "pywebview>=5.0",
    "pystray>=0.19",
    "Pillow>=10.0",
]
spiffe = [
    "spiffe>=0.2.0",
]
# ADR-032 F3 Phase 1: Linux TPM 2.0 hardware attestation. Optional so
# core test runs and Connector installs without a TPM keep using the soft
# keystore fallback. Requires kernel resource manager at /dev/tpmrm0
# (Linux >= 4.12) or a swtpm socket pointed at by TCTI env vars.
tpm = [
    "tpm2-pytss>=2.0",
]
# ADR-033 Phase 2: WebAuthn-bound user session tokens for Frontdesk shared
# mode. Optional so deployments still pinned to Phase 1 (warn-only) keep
# installing core packages without pulling extra crypto. When
# MCP_PROXY_WEBAUTHN_ENFORCEMENT="required" the Mastio refuses to start
# unless the import succeeds (see config.validate_settings).
webauthn = [
    "webauthn>=2.0,<3.0",
]
# ADR-039 — legacy LiteLLM backend (``MCP_PROXY_AI_GATEWAY_BACKEND=
# litellm_embedded``). Retained for operators who depend on Gemini /
# Bedrock / Vertex (no native adapter yet). Default Mastio install
# never pulls this — only the operator who explicitly opts into the
# legacy backend. Floor pinned at 1.83.7 to dodge the April-May 2026
# CVE cluster (CVE-2026-42208 / 42271 / 35029 / 35030 / GHSA-69x8) and
# the March 2026 supply-chain compromise of 1.82.7 / 1.82.8.
litellm-legacy = [
    "litellm>=1.83.7,<2.0",
]

[project.scripts]
cullis-proxy = "mcp_proxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cullis_sdk"]

[tool.ruff]
# The CI gate (.github/workflows/ci.yml job "ruff") runs exactly
# `ruff check mcp_proxy cullis_sdk scripts test`. Ruff does not run on
# every dev machine (NixOS needs nix-shell for libstdc++), so the CI
# job is the authoritative lint gate — keep this config in sync with it.

[tool.ruff.lint]
# Default rule set (E4/E7/E9 + F) minus E402: the codebase deliberately
# places imports mid-file in two load-bearing patterns — the router
# mounts in mcp_proxy/main.py (import order IS the mount order) and the
# lazy per-function imports that break circular dependencies between
# db/config/auth. Flagging those 65 sites would invite mechanical
# "fixes" that reintroduce import cycles.
ignore = ["E402"]

[tool.pytest.ini_options]
# Aligns the public test surface with the suite the repatriated core
# tests were written under (cullis-enterprise uses asyncio_mode=auto).
# Under the default "strict" mode, async fixtures declared with the
# plain @pytest.fixture decorator are silently ignored (PytestRemovedIn9
# error), breaking the guardian/kms test modules. "auto" treats async
# defs (tests + fixtures) as asyncio without an explicit marker.
asyncio_mode = "auto"
